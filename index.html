      (function () {
        if (!("serviceWorker" in navigator)) return;
        navigator.serviceWorker.getRegistrations()
          .then(function (registrations) {
            return Promise.all(registrations.map(function (registration) {
              return registration.unregister();
            }));
          })
          .then(function () {
            if (!("caches" in window)) return;
            return caches.keys().then(function (names) {
              return Promise.all(names.map(function (name) { return caches.delete(name); }));
            });
          })
          .catch(function () {});
      })();
    </script>

    <!--
      Non-render-blocking Google Fonts: `media="print"` makes the stylesheet
      non-applicable at parse time so it doesn't block first paint; once it
      loads, the onload handler flips media back to "all" so the fonts apply.
      Why this matters: iOS Safari with a content blocker (1Blocker / AdGuard
      / Brave Shields — extremely common on iPhones) silently *stalls* the
      fonts.googleapis.com request, and a render-blocking <link> there leaves
      the page on an infinite "loading" spinner until the browser times out
      (10-30s). The print/all swap defers font application without blocking.
    -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&display=swap"
      media="print"
      onload="this.media='all'"
    />
